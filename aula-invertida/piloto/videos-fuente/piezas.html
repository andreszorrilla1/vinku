<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:SG;src:url(fonts/schibsted-grotesk-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:SG;src:url(fonts/schibsted-grotesk-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:SG;src:url(fonts/schibsted-grotesk-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:SG;src:url(fonts/schibsted-grotesk-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:IS;src:url(fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:PM;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:SG,sans-serif;color:#EEF4F1;-webkit-font-smoothing:antialiased;background:#0D2F33}
.pieza{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 85% 0%,#14444a 0%,#0D2F33 55%,#0b2629 100%);padding:90px 84px}
.puntos{position:absolute;inset:0;background-image:radial-gradient(#86CBB9 1.4px,transparent 1.6px);background-size:44px 44px;opacity:.07}
.top{display:flex;align-items:center;gap:16px;position:relative}
.top b{font-weight:800;font-size:40px;letter-spacing:-.04em}.top em{font-family:IS;font-style:italic;color:#86CBB9;font-size:36px;margin-left:6px}
.top span{margin-left:auto;font-family:PM;font-size:24px;color:#9DB5B0;text-transform:uppercase;letter-spacing:.08em}
.kick{font-family:PM;font-size:28px;color:#FF8A4C;text-transform:uppercase;letter-spacing:.08em;margin-top:80px;position:relative}
h1{font-size:92px;line-height:1.03;letter-spacing:-.03em;font-weight:800;margin-top:18px;position:relative}
h1 i{font-family:IS;font-weight:400;color:#86CBB9;letter-spacing:0}
.pasos{position:relative;margin-top:70px;display:flex;flex-direction:column;gap:0}
.paso{display:flex;gap:34px;align-items:center;min-height:132px}
.nodo{flex:none;width:70px;height:70px;border-radius:50%;background:#86CBB9;position:relative;z-index:2}
.nodo.abierto{background:#0D2F33;border:12px solid #86CBB9}.nodo.lleno{background:#FF8A4C}
.paso p{font-size:46px;font-weight:700}.paso small{display:block;font-size:30px;font-weight:400;color:#B9CDC8;margin-top:4px}
.linea{position:absolute;left:33px;top:50px;bottom:50px;width:5px;background:linear-gradient(#86CBB9,#FF8A4C);border-radius:4px}
.pie{position:absolute;left:84px;right:84px;bottom:70px;display:flex;justify-content:space-between;font-family:PM;font-size:24px;color:#9DB5B0;text-transform:uppercase;letter-spacing:.08em}
.tabla{position:relative;margin-top:50px;display:grid;grid-template-columns:1fr 1fr;border-radius:30px;overflow:hidden}
.tabla div{padding:24px 28px;font-size:34px;line-height:1.2}
.tabla .h1{background:#173B38;font-weight:800;font-size:44px}.tabla .h2{background:#E8692E;font-weight:800;font-size:44px}
.tabla .c1{background:#123a3e;border-top:2px solid #1E4044}.tabla .c2{background:#2a2a20;background:rgba(255,138,76,.14);border-top:2px solid #3a2a1e}
/* Insignia */
.badge{width:1200px;height:1200px;display:grid;place-items:center;background:transparent}
</style></head>
<body>
<div id="r"></div>
<script>
const Q=new URLSearchParams(location.search).get("p");
const cab=(l)=>`<div class="puntos"></div><div class="top"><svg width="58" height="58" viewBox="0 0 40 40"><path d="M9 17v8a11 11 0 0 0 22 0v-8" fill="none" stroke="#EEF4F1" stroke-width="5.5" stroke-linecap="round"/><path d="M9 9.5Q20 1 31 9.5" fill="none" stroke="#86CBB9" stroke-width="3" stroke-linecap="round"/><circle cx="9" cy="10" r="3.4" fill="#0D2F33" stroke="#86CBB9" stroke-width="2.2"/><circle cx="31" cy="10" r="4" fill="#FF8A4C"/></svg><b>VinkU</b><em>edu</em><span>${l}</span></div>`;
const pie=`<div class="pie"><span>Consultorio · piloto</span><span>@vinkuedu</span></div>`;
const pasos=(items)=>`<div class="pasos"><div class="linea"></div>${items.map(([t,s],i)=>`<div class="paso"><span class="nodo ${i===0?"abierto":i===items.length-1?"lleno":""}"></span><p>${t}<small>${s}</small></p></div>`).join("")}</div>`;
const P={
 info1:()=>`<div class="pieza">${cab("Infografía · 1/3")}<p class="kick">El recorrido de una sesión</p><h1>De la consulta a la <i>historia aprobada</i>.</h1>${pasos([["Sesión con Tactiq","Atiendes; la sesión se transcribe con autorización"],["Borrador en Notion","La IA redacta con tus palabras"],["Revisas y apruebas","La firma es tuya"],["Cobro creado","Sin pasos extra"],["Cierre semanal","Cartera, pendientes y seguimiento"]])}${pie}</div>`,
 info2:()=>`<div class="pieza">${cab("Infografía · 2/3")}<p class="kick">La firma sigue siendo tuya</p><h1>Lo que hace la IA, <i>lo que decides tú</i>.</h1><div class="tabla"><div class="h1">La IA</div><div class="h2">Tú</div>${[["Transcribe y ordena","Defines el nivel de riesgo"],["Redacta borradores","Apruebas, corriges o descartas"],["Calcula puntajes y saldos","Haces la impresión diagnóstica"],["Te recuerda pendientes","Decides qué sale hacia el consultante"]].map(([a,b])=>`<div class="c1">${a}</div><div class="c2">${b}</div>`).join("")}</div>${pie}</div>`,
 info3:()=>`<div class="pieza">${cab("Infografía · 3/3")}<p class="kick">Tu semana con Consultorio</p><h1>Una rutina corta para <i>no trabajar de noche</i>.</h1>${pasos([["Cada mañana","«resumen del día»: citas y pendientes"],["Después de cada sesión","El borrador llega solo"],["Al final del día","«revisé los borradores, apruébalos»"],["Viernes en la tarde","«cierre semanal»"]])}${pie}</div>`,
 badge:()=>`<div class="badge"><svg width="1100" height="1100" viewBox="0 0 1100 1100">
   <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#86CBB9"/><stop offset="1" stop-color="#FF8A4C"/></linearGradient>
   <path id="arcoA" d="M150 550 A400 400 0 0 1 950 550"/><path id="arcoB" d="M130 560 A420 420 0 0 0 970 560"/></defs>
   <circle cx="550" cy="550" r="520" fill="#0D2F33"/>
   <circle cx="550" cy="550" r="490" fill="none" stroke="url(#g)" stroke-width="16"/>
   <circle cx="550" cy="550" r="455" fill="none" stroke="#86CBB9" stroke-opacity=".25" stroke-width="3" stroke-dasharray="4 14"/>
   <text font-family="PM" font-size="40" letter-spacing="9" fill="#9DB5B0"><textPath href="#arcoA" startOffset="50%" text-anchor="middle">VINKU EDU · MICROCERTIFICACIÓN</textPath></text>
   <g transform="translate(550 400) scale(7.5) translate(-20 -20)"><path d="M9 17v8a11 11 0 0 0 22 0v-8" fill="none" stroke="#EEF4F1" stroke-width="5.5" stroke-linecap="round"/><path d="M9 9.5Q20 1 31 9.5" fill="none" stroke="#86CBB9" stroke-width="3" stroke-linecap="round"/><circle cx="9" cy="10" r="3.4" fill="#0D2F33" stroke="#86CBB9" stroke-width="2.2"/><circle cx="31" cy="10" r="4" fill="#FF8A4C"/></g>
   <text x="550" y="660" text-anchor="middle" font-family="SG" font-weight="800" font-size="50" fill="#EEF4F1">Optimización con IA</text>
   <text x="550" y="718" text-anchor="middle" font-family="SG" font-weight="800" font-size="50" fill="#EEF4F1">de procesos administrativos</text>
   <text x="550" y="776" text-anchor="middle" font-family="SG" font-weight="800" font-size="50" fill="#EEF4F1">y clínicos</text>
   <text x="550" y="846" text-anchor="middle" font-family="IS" font-style="italic" font-size="60" fill="#86CBB9">en consultorio psicológico</text>
   <text font-family="PM" font-size="34" letter-spacing="8" fill="#FF8A4C"><textPath href="#arcoB" startOffset="50%" text-anchor="middle">HABILIDAD VERIFICADA</textPath></text>
 </svg></div>`,
};
document.getElementById("r").innerHTML=P[Q]();
</script></body></html>
